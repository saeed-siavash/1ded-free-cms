name: PHP edition checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        database: ['sqlite', 'mysql']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-test-password-only
          MARIADB_DATABASE: cms_test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite, gd, fileinfo, mbstring, openssl, zip
          coverage: none
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Locate standalone or nested PHP edition
        run: |
          if [ -f app/core.php ]; then echo "PHP_CMS_DIRECTORY=." >> "$GITHUB_ENV"; else echo "PHP_CMS_DIRECTORY=php-edition" >> "$GITHUB_ENV"; fi
      - name: Check PHP syntax
        run: find "$PHP_CMS_DIRECTORY" -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: RFC 6238 vectors
        working-directory: ${{ env.PHP_CMS_DIRECTORY }}
        run: |
          php tests/totp-vectors.php
          php tests/security-vectors.php
      - name: Integration
        working-directory: ${{ env.PHP_CMS_DIRECTORY }}
        env:
          CMS_TEST_DB: ${{ matrix.database }}
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: ${{ job.services.mariadb.ports[3306] }}
          MYSQL_DATABASE: cms_test
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-test-password-only
        run: node --test tests/integration.mjs

